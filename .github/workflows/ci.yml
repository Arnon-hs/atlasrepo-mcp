name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: atlasrepo-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 1 / Build MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --omit=dev

  deploy:
    name: 2 / Observe Zeabur deploy
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && needs.auto-merge.result == 'success') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality.result == 'success'))
    needs: [quality, auto-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the single Git-triggered deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event_name == 'pull_request' && needs.auto-merge.outputs.release_sha || github.sha }}
        run: |
          test -n "$RELEASE_SHA"
          for attempt in $(seq 1 60); do
            check="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" --jq '[.check_runs[] | select(.app.name == "Zeabur" and .name == "Zeabur")][0] // {}')"
            status="$(jq -r '.status // "waiting"' <<<"$check")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$check")"
            url="$(jq -r '.details_url // ""' <<<"$check")"
            if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then echo "Zeabur deployment succeeded: ${url}"; exit 0; fi
            if [[ "$status" == "completed" && "$conclusion" != "" ]]; then echo "Zeabur deployment finished with ${conclusion}: ${url}" >&2; exit 1; fi
            echo "Waiting for Zeabur deployment (${status}; ${attempt}/60)"
            sleep 15
          done
          echo "Timed out waiting for Zeabur" >&2
          exit 1

  migrations:
    name: 3 / Migrations
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "MCP service has no database migrations."

  tests:
    name: 4 / Tests
    needs: migrations
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors https://mcp.atlasrepo.com/livez >/dev/null
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors https://mcp.atlasrepo.com/readyz >/dev/null

  cache_cleanup:
    name: 5 / Cache cleanup and warmup
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail-with-body "https://mcp.atlasrepo.com/livez?release=${GITHUB_RUN_ID}" >/dev/null

  auto-merge:
    name: Auto merge to main
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_sha: ${{ steps.merge.outputs.release_sha }}
    steps:
      - name: Squash merge green pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
          for attempt in $(seq 1 60); do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            release_sha="$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid // empty')"
            if [[ "$state" == "MERGED" && -n "$release_sha" ]]; then
              echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "Merge completed without a resolvable merge commit" >&2
          exit 1
