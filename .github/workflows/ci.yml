name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: atlasrepo-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Public PR quality gates
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --omit=dev

  auto-merge:
    name: Auto merge trusted PR
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge unchanged green pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          current_head="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)"
          test "$current_head" = "$EXPECTED_HEAD_SHA"
          gh pr merge "$PR_URL" --squash --delete-branch --subject "$PR_TITLE"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  verify-main:
    name: Main / Build, test, and verify MCP image
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'Arnon-hs/atlasrepo-mcp' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, jit-runner, "jit-run-${{ github.run_id }}"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --omit=dev
      - name: Build and inspect container image
        run: |
          image="atlasrepo-mcp:verify-${GITHUB_SHA}"
          docker build --tag "$image" .
          docker image inspect "$image" >/dev/null
