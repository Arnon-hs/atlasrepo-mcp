name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: atlasrepo-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Public PR quality gates
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --omit=dev

  auto-merge:
    name: Auto merge trusted PR
    needs: quality
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge unchanged green pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          current_head="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)"
          test "$current_head" = "$EXPECTED_HEAD_SHA"
          gh pr merge "$PR_URL" --squash --delete-branch --subject "$PR_TITLE"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  provision:
    name: Control / Provision JIT runner
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      runner-label: ${{ steps.runner.outputs.runner-label }}
      runner-id: ${{ steps.runner.outputs.runner-id }}
      run-key: ${{ steps.runner.outputs.run-key }}
    steps:
      - id: runner
        uses: Arnon-hs/jit-runner-kit/actions/provision@96807f37c85f7f6f6b5743e305e6385157fafd4d
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.JIT_RUNNER_GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          server-type: cx33
          location: fsn1
          ttl-minutes: 180
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runner.outputs.state-dir }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Workload / Build, observe deploy, and verify MCP
    needs: provision
    runs-on: [self-hosted, linux, x64, "${{ needs.provision.outputs.runner-label }}"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm audit --omit=dev
      - name: Wait for the single Git-triggered deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            check="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" --jq '[.check_runs[] | select(.app.name == "Zeabur" and .name == "Zeabur")][0] // {}')"
            status="$(jq -r '.status // "waiting"' <<<"$check")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$check")"
            url="$(jq -r '.details_url // ""' <<<"$check")"
            if [[ "$status" == completed && "$conclusion" == success ]]; then
              echo "Zeabur deployment succeeded: ${url}"
              break
            fi
            if [[ "$status" == completed && -n "$conclusion" ]]; then
              echo "Zeabur deployment finished with ${conclusion}: ${url}" >&2
              exit 1
            fi
            if (( attempt == 60 )); then
              echo "Timed out waiting for Zeabur" >&2
              exit 1
            fi
            sleep 15
          done
      - name: Verify live service
        run: |
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors https://mcp.atlasrepo.com/livez >/dev/null
          curl --fail-with-body --retry 12 --retry-delay 5 --retry-all-errors https://mcp.atlasrepo.com/readyz >/dev/null
          curl --fail-with-body "https://mcp.atlasrepo.com/livez?release=${GITHUB_RUN_ID}" >/dev/null

  cleanup:
    name: Control / Cleanup JIT runner
    if: ${{ always() && needs.provision.result != 'skipped' }}
    needs: [provision, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.provision.outputs.run-key != ''
        continue-on-error: true
        with:
          name: runner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jit-runner-state
      - uses: Arnon-hs/jit-runner-kit/actions/destroy@96807f37c85f7f6f6b5743e305e6385157fafd4d
        if: needs.provision.outputs.run-key != ''
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.JIT_RUNNER_GITHUB_TOKEN }}
          state-dir: ${{ runner.temp }}/jit-runner-state
          run-key: ${{ needs.provision.outputs.run-key }}
          repository: ${{ github.repository }}
          runner-id: ${{ needs.provision.outputs.runner-id }}
